<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Calculator</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <main>
        <h1>Arithmetic operations</h1>
        <p>Enter two numbers to see the results.</p>

        <form id="calculator-form">
            <label for="first-number">First number:</label>
            <input id="first-number" name="firstNumber" type="number" step="any" value="20" required>
            <br><br>
            <label for="second-number">Second number:</label>
            <input id="second-number" name="secondNumber" type="number" step="any" value="5" required>
            <br><br>
            <button type="submit">Calculate</button>
            <p id="message" role="alert" aria-live="polite"></p>
        </form>

        <section aria-labelledby="results-heading" aria-live="polite">
            <h2 id="results-heading">Results</h2>
            <table>
                <thead><tr><th scope="col">Operation</th><th scope="col">Result</th></tr></thead>
                <tbody id="results-body"></tbody>
            </table>
        </section>
    </main>

    <script>
        const form = document.querySelector('#calculator-form');
        const firstNumber = document.querySelector('#first-number');
        const secondNumber = document.querySelector('#second-number');
        const resultsBody = document.querySelector('#results-body');
        const message = document.querySelector('#message');

        function formatResult(value) {
            if (!Number.isFinite(value)) return 'Undefined';
            return Number.isInteger(value) ? String(value) : String(Number(value.toFixed(8)));
        }

        function calculate(event) {
            event.preventDefault();
            message.textContent = '';

            if (!form.reportValidity()) return;

            const a = firstNumber.valueAsNumber;
            const b = secondNumber.valueAsNumber;
            const operations = [
                ['Addition', a + b],
                ['Subtraction', a - b],
                ['Multiplication', a * b],
                ['Division', b === 0 ? null : a / b],
                ['Modulus', b === 0 ? null : a % b],
                ['Exponentiation', a ** b],
            ];

            resultsBody.replaceChildren(...operations.map(([operation, result]) => {
                const row = document.createElement('tr');
                const operationCell = document.createElement('td');
                const resultCell = document.createElement('td');
                operationCell.textContent = operation;
                resultCell.textContent = result === null ? 'Undefined' : formatResult(result);
                row.append(operationCell, resultCell);
                return row;
            }));
        }

        form.addEventListener('submit', calculate);
        form.requestSubmit();
    </script>
</body>
</html>
